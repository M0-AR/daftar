[project]
name = "daftar"
version = "0.2.0"
description = "Private document chat that runs entirely on your computer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "fpdf2>=2.7",
  "numpy>=1.26",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8", "pyinstaller>=6.0"]

[project.scripts]
daftar = "daftar.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daftar*"]

[tool.setuptools.package-data]
daftar = ["static/*"]

[tool.pytest.ini_options]
markers = ["live: needs the built-in llama.cpp engine or a running local Ollama"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
