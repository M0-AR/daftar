# Build Daftar for Windows, macOS and Linux and smoke-test each build on its own OS.
# PyInstaller cannot cross-compile, so every target builds on a runner of that OS.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Python (Windows, macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (Windows, macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]"

      - name: Install (Linux, system Python with GTK/WebKit for the native window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-webkit2-4.1
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[desktop,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: python -m pytest -q

      - name: Build
        run: python scripts/build.py

      - name: Smoke test the built app
        run: python scripts/smoke_build.py

      - name: Zip the app (keeps macOS bundle metadata intact)
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent Daftar.app "Daftar-macOS.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then 7z a "Daftar-Windows.zip" Daftar > /dev/null
          else tar czf "Daftar-Linux.tar.gz" Daftar; fi

      - uses: actions/upload-artifact@v7
        with:
          name: Daftar-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
